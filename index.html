<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presupuestos Alcolea</title>
<meta name="description" content="Presupuestos de instalaciones hablando con el móvil.">
<meta name="theme-color" content="#1E1E20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alcolea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: widgets oscuros estilo Index. Fondo gris carbón, tarjetas negras con etiqueta pequeña, título blanco, cifra en azul, barras por tramos y anillos. Mantiene 19px de base y botones de 64px. */
:root{
  --bg:#1E1E20; --surface:#0B0B0C; --sunken:#2A2A2D; --line:#333337; --fg:#F5F5F7; --muted:#9A9AA1;
  --pri:#3D7BF5; --pri-ink:#5B92FF; --on-pri:#FFFFFF; --card:#0B0B0C; --on-card:#F5F5F7; --card-muted:#9A9AA1; --card-pri:#5B92FF;
  --cyan:#5BC8E0; --yel:#F5D33B;
  --ok:#5ED36F; --ok-bg:#0B0B0C; --warn:#F5D33B; --warn-bg:#0B0B0C; --bad:#FF6B5E; --bad-bg:#0B0B0C; --info:#5B92FF; --info-bg:#0B0B0C;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,"Segoe UI",Roboto,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 19px/1.42 var(--body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.025em}
h1{font-size:2.15rem}
h2{font-size:1.45rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.marca b{font:600 1.3rem/1 var(--display);letter-spacing:-.02em}
.hero{background:var(--bg)}
.hero-in{padding-block:6px 22px;display:flex;flex-direction:column;gap:16px}
.pasos{display:flex;flex-direction:column;gap:8px;font-size:1.02rem;margin:0;padding:0;list-style:none}
.pasos li{display:flex;gap:10px;align-items:center}
.pasos i{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);font:600 .95rem/26px var(--display);font-style:normal;text-align:center}
.pasos svg{vertical-align:-3px}
textarea{width:100%;min-height:140px;border:0;border-radius:22px;background:var(--surface);color:var(--fg);padding:16px 18px;font-size:1.15rem;line-height:1.4;resize:vertical;box-shadow:inset 0 0 0 1px var(--line)}
textarea:focus{box-shadow:inset 0 0 0 2px var(--pri);outline:none}
textarea::placeholder,input::placeholder{color:var(--muted)}
.mic-zona{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:600;font-size:1.1rem}
.mic{width:128px;height:128px;border-radius:50%;border:0;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 35%,transparent)}
.mic.oyendo{background:var(--bad);color:#fff;box-shadow:0 0 0 10px color-mix(in srgb,var(--bad) 18%,transparent)}
@media (prefers-reduced-motion:no-preference){.mic.oyendo{animation:late 1.2s ease-in-out infinite}@keyframes late{50%{transform:scale(1.06)}}}
textarea#dictado{min-height:104px}
.btn{min-height:64px;padding:12px 24px;border-radius:999px;border:0;background:var(--surface);color:var(--fg);font-weight:600;font-size:1.08rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;width:100%;box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{box-shadow:inset 0 0 0 2px var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);color:var(--on-pri);font-size:1.2rem;min-height:72px;box-shadow:none}
.btn.pri:hover{background:var(--pri-ink)}
.btn.borrar{color:var(--bad)}
.enlace{all:unset;cursor:pointer;color:var(--pri-ink);font-weight:600;padding:12px 4px;text-align:center}
.enlace:focus-visible{outline:3px solid var(--pri)}
.aviso{padding:14px 18px;border-radius:20px;background:var(--info-bg);color:var(--info)}
.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.aviso.bad{background:var(--bad-bg);color:var(--bad)}
main{padding-block:12px 112px}
.pila{display:flex;flex-direction:column;gap:18px}
.seccion{display:flex;flex-direction:column;gap:12px}
.tarjetas{display:flex;flex-direction:column;gap:8px}
.pres{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;background:var(--card);color:var(--on-card);border-radius:22px;cursor:pointer;width:100%}
.pres:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pres .a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pres b{font:600 1.3rem/1.15 var(--display);color:var(--card-pri);letter-spacing:-.02em;overflow-wrap:anywhere}
.pres .imp{font:600 1.3rem/1.1 var(--display);color:var(--on-card)}
.pres small{color:var(--card-muted);font-size:1rem;overflow-wrap:anywhere}
.pill{font-size:.9rem;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
.pres .pill{background:rgba(255,255,255,.1);color:var(--on-card)}
.pres .st-aceptado{background:#1E4D33;color:#8BE5AF}
.pres .st-rechazado{background:#4D1F1C;color:#FFA59E}
.pres .st-enviado{background:#1E3463;color:#A9C4FF}
.st-borrador{background:var(--sunken);color:var(--muted)}
.st-enviado{background:var(--info-bg);color:var(--info)}
.st-aceptado{background:var(--ok-bg);color:var(--ok)}
.st-rechazado{background:var(--bad-bg);color:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px;gap:6px}
.nav button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-height:64px;border-radius:20px;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;text-align:center}
.nav button[aria-current="page"]{color:var(--pri-ink);background:var(--info-bg)}
.nav button:focus-visible{outline:3px solid var(--pri);outline-offset:-3px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.volver{all:unset;cursor:pointer;font-weight:600;color:var(--pri-ink);display:flex;align-items:center;gap:6px;min-height:60px;padding-right:12px}
.volver:focus-visible{outline:3px solid var(--pri)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;min-width:0;font-size:1rem;color:var(--muted)}
input,select{min-height:62px;width:100%;min-width:0;border:0;border-radius:18px;background:var(--surface);padding:10px 16px;font-weight:400;color:var(--fg);font-size:1.15rem;box-shadow:inset 0 0 0 1px var(--line)}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--pri)}
.linea{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.linea.sin{box-shadow:inset 0 0 0 2px var(--warn)}
.linea .t{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.linea .t b{font:600 1.12rem/1.25 var(--display);overflow-wrap:anywhere;min-width:0}
.linea .imp{font-weight:600;white-space:nowrap}
.pasador{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:8px;align-items:center}
.pasador button{height:64px;border-radius:50%;border:2px solid var(--pri);background:transparent;color:var(--pri);font:500 2rem/1 var(--display);cursor:pointer;padding:0}
.pasador button:active{background:var(--info-bg)}
.pasador span{text-align:center;font-weight:600;font-size:1.15rem}
.falta{color:var(--warn);font-weight:600}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.total{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);color:var(--on-card);padding-bottom:env(safe-area-inset-bottom,0px)}
.total-in{padding-block:12px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px}
.total small{display:block;color:var(--card-muted);font-size:.95rem}
.total strong{font:600 1.65rem/1.05 var(--display);white-space:nowrap;letter-spacing:-.02em}
.total .btn{min-height:64px}
.hoja{background:#fff;color:#0B0B0C;border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;gap:14px;font-size:1rem;overflow-wrap:break-word;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(0,0,0,.06)}
.hoja header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hoja h3{font-size:1.45rem}
.hoja table{width:100%;border-collapse:collapse}
.hoja th{text-align:left;font-size:.85rem;font-weight:600;color:#5C5C63;border-bottom:2px solid #2E6BF0;padding:4px}
.hoja td{padding:8px 4px;border-bottom:1px solid #E5E5EA;vertical-align:top}
.hoja .d{text-align:right;white-space:nowrap}
.hoja .suma{margin-left:auto;width:min(100%,260px)}
.hoja .suma div{display:flex;justify-content:space-between;padding:3px 0}
.hoja .suma .g{font-weight:600;font-size:1.3rem;border-top:2px solid #2E6BF0;padding-top:6px}
.tabla-scroll{overflow-x:auto}
.estado{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.estado button{min-height:60px;border:0;background:var(--surface);border-radius:999px;cursor:pointer;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.estado button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);box-shadow:none}
.precio{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.precio .n{min-width:0;overflow-wrap:anywhere;font-weight:600}
.precio small{display:block;color:var(--muted);font-weight:400}
.cat{font:600 1.15rem/1 var(--display);padding-top:16px;color:var(--pri-ink)}
details{background:var(--surface);border-radius:22px;padding:0 16px}
summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px;min-height:64px;align-items:center}
details[open]{padding-bottom:16px}
.comp{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding-top:10px}
.cambio{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:12px}
.opcion{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:68px;padding:10px 18px;background:var(--surface);border-radius:20px;cursor:pointer;width:100%;margin-top:8px;font-weight:600}
.opcion span+span{font-weight:400;color:var(--muted);white-space:nowrap}
.opcion:focus-visible{outline:3px solid var(--pri)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);color:var(--on-card);padding:12px 20px;border-radius:999px;max-width:calc(100% - 32px)}

.aviso{background:var(--surface)}
.btn{background:var(--surface);color:var(--fg)}
.pres{border-radius:18px;padding:16px 18px 18px;gap:6px}
.pres b{color:var(--on-card);font-size:1.25rem}
.pres .imp{color:var(--card-pri)}
.pres .imp.aceptado{color:var(--ok)}
.pres .imp.rechazado{color:var(--card-muted);text-decoration:line-through}
.ojo{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--card-muted);font-weight:500}
.ojo svg{flex:none}
.barra{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.barra i{height:5px;border-radius:3px;background:#3A3A3E}
.barra i.on{background:var(--pri)}
.barra i.ok{background:var(--ok)}
.barra i.mal{background:var(--bad)}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.widget{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.widget .big{font:700 3.2rem/1 var(--display);letter-spacing:-.04em;color:var(--fg)}
.widget .big.azul{color:var(--card-pri)}
.widget small{color:var(--card-muted);font-size:.95rem}
.anillo{position:relative;width:96px;height:96px}
.anillo svg{transform:rotate(-90deg)}
.anillo span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 1.25rem/1 var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;font-size:1rem}
.chip em{font-style:normal}
.chip .v{color:var(--ok)}
.chip .a{color:var(--card-pri)}
.chip .punto{width:10px;height:10px;border-radius:50%;background:var(--pri)}
.hero-in h1{font-size:2rem}

/* Microinteracciones */
.btn,.pres,.opcion,.nav button,.pasador button,.mic,.estado button,.chip,.volver,.enlace,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (prefers-reduced-motion:no-preference){
  .btn,.pres,.opcion,.nav button,.pasador button,.estado button,.mic{transition:transform .22s cubic-bezier(.3,1.4,.5,1),background-color .2s,box-shadow .2s,color .2s}
  .btn:active:not(:disabled),.pres:active,.opcion:active,.estado button:active{transform:scale(.965);transition-duration:.08s}
  .nav button:active,.pasador button:active{transform:scale(.88);transition-duration:.08s}
  .mic:active{transform:scale(.92);transition-duration:.08s}
  .nav button svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .nav button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
  .salta{animation:salta .32s cubic-bezier(.3,1.6,.5,1)}
  @keyframes salta{40%{transform:scale(1.18)}}
  .anima .widget,.anima .pres,.anima .chip{animation:sube .5s cubic-bezier(.2,.9,.3,1) both}
  .anima .chip:nth-child(2){animation-delay:.05s}
  .anima .widget:nth-child(1){animation-delay:.08s}.anima .widget:nth-child(2){animation-delay:.14s}
  .anima .brief,.anima .saludo h1,.anima .caja{animation:sube .5s cubic-bezier(.2,.9,.3,1) both}
  .anima .caja{animation-delay:.06s}.anima .brief:nth-child(1){animation-delay:.14s}.anima .brief:nth-child(2){animation-delay:.2s}.anima .brief:nth-child(3){animation-delay:.26s}
  .anima .pres:nth-child(1){animation-delay:.18s}.anima .pres:nth-child(2){animation-delay:.24s}.anima .pres:nth-child(3){animation-delay:.3s}
  @keyframes sube{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .anima .barra i{animation:crece .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
  .anima .barra i:nth-child(2){animation-delay:.1s}.anima .barra i:nth-child(3){animation-delay:.2s}
  @keyframes crece{from{transform:scaleX(0)}}
  .anima .anillo circle+circle{animation:dibuja 1s .2s cubic-bezier(.2,.9,.3,1) both}
  @keyframes dibuja{from{stroke-dasharray:0 999}}
  .sheet-fondo{animation:funde .25s ease both}
  .sheet{animation:hoja .45s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes funde{from{opacity:0}}
  @keyframes hoja{from{transform:translateY(100%)}}
  .toast{animation:tost .45s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes tost{from{opacity:0;transform:translate(-50%,24px) scale(.9)}}
  .onda{display:inline-flex;gap:3px;align-items:center;height:18px;margin-right:8px;vertical-align:-3px}
  .onda i{width:4px;border-radius:2px;background:var(--bad);animation:onda .9s ease-in-out infinite}
  .onda i:nth-child(2){animation-delay:.15s}.onda i:nth-child(3){animation-delay:.3s}.onda i:nth-child(4){animation-delay:.45s}
  @keyframes onda{0%,100%{height:5px}50%{height:18px}}
  ::view-transition-old(root){animation:.22s ease both vt-sale}
  ::view-transition-new(root){animation:.32s cubic-bezier(.2,.9,.3,1) both vt-entra}
  @keyframes vt-sale{to{opacity:0;transform:scale(.985)}}
  @keyframes vt-entra{from{opacity:0;transform:translateX(18px)}}
}
.toast{display:flex;align-items:center;gap:8px}
.toast::before{content:"✓";color:var(--ok);font-weight:700}

/* Estilo Index: pantallas */
:root{--bg:#000000;--card:#1C1C1E;--surface:#1C1C1E;--sunken:#2C2C2E;--line:#38383C}
.top-app{display:flex;align-items:center;gap:10px;padding-block:14px 4px}
.top-app .nombre{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:1.05rem}
.top-app .yo{all:unset;margin-left:auto;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);cursor:pointer}
.top-app .yo:focus-visible{outline:3px solid var(--pri)}
.saludo{text-align:center;padding-block:18px 22px;border-bottom:1px solid var(--line)}
.saludo h1{font-size:2.15rem;font-weight:500;color:#D8D8DD;letter-spacing:-.03em}
.saludo .grad{display:block;background:linear-gradient(90deg,#3D7BF5,#8B6CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cabeza{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.98rem;font-weight:500}
.cabeza .ojo{color:var(--fg)}
.cabeza button{all:unset;cursor:pointer;color:var(--muted);padding:8px 0}
.brief{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.brief p{font-weight:600;font-size:1.12rem;line-height:1.3}
.brief small{color:var(--muted);font-size:.98rem}
.brief .btn{width:auto;min-height:56px;margin-top:6px;padding:10px 22px;border-radius:12px;font-size:1.12rem}
.brief .btn:not(.pri){background:var(--sunken);box-shadow:none}
.tag{display:inline-block;border-radius:8px;padding:2px 9px;font-weight:600;font-size:.92rem}
.tag.amarillo{background:#F5D33B;color:#1A1500}
.tag.azul{background:#2F6FEB;color:#fff}
.tag.verde{background:#5ED36F;color:#06210C}
.tag.gris{background:#3A3A3E;color:#D8D8DD}
.ficha-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ficha-cab h1{font-size:2rem;font-weight:500}
.volver.chev{min-height:48px;font-size:1.8rem;padding-right:4px;color:var(--fg)}
.marco{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.marco .ojo{color:var(--muted)}
.marco ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-weight:600}
.marco li::before{content:"✓";color:var(--ok);margin-right:10px;font-weight:700}
.marco.azul{border-color:var(--pri)}
.marco.azul .ojo{color:var(--pri-ink)}
.marco .msg{font-weight:600;font-size:1.1rem;line-height:1.35}
.marco .fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.marco .fila .btn{width:auto;min-height:56px;padding:10px 22px;border-radius:12px}
.marco .fila .btn:not(.pri){background:var(--sunken);box-shadow:none}
.compositor{display:flex;gap:10px;align-items:center}
.compositor textarea{min-height:64px;border-radius:32px;padding:18px 22px;flex:1;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.compositor .mic{width:64px;height:64px;flex:none;box-shadow:none}
.compositor .mic svg{width:30px;height:30px}

const ITEMS_BASE=[

 {id:"t-termo",nombre:"Cambiar termo",claves:"\\btermos?\\b",comp:[["termo",1],["llave",1],["oficial",3],["retirada",1],["desp",1]]},
 {id:"t-grifo",nombre:"Cambiar grifo",claves:"\\bgrifos?\\b",comp:[["oficial",1],["desp",1]]},

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
const PALABRAS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,dieciocho:18,veinte:20,veinticinco:25,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,cien:100};
function conNumeros(t){return t.replace(/\b[a-z]+\b/g,w=>PALABRAS[w]!==undefined?String(PALABRAS[w]):w)}
function aNumero(s){return Number(String(s).replace(",","."))}
function redondea(n){return Math.round(n*100)/100}
function crearCatalogo(){return ITEMS_BASE.map(([id,cat,nombre,unidad,precio,claves])=>({id,cat,nombre,unidad,precio,claves}))}
function crearTrabajos(){return TRABAJOS_BASE.map(t=>({...t,comp:t.comp.map(c=>[...c])}))}
function lineaDe(item,cantidad){return{id:item.id,nombre:item.nombre,unidad:item.unidad,cantidad,precio:item.precio}}
function re(c){try{return new RegExp(c)}catch(e){return /$^/}}
function interpretarLocal(texto,catalogo,trabajos){
  const t=conNumeros(norm(texto));
  const lineas=[];const porId=id=>lineas.find(l=>l.id===id);
  const item=id=>catalogo.find(i=>i.id===id);
  const pon=(id,c)=>{const i=item(id);if(!i)return;const l=porId(id);if(l)l.cantidad=c;else lineas.push(lineaDe(i,c))};
  const encontrados=[];
  for(const tr of trabajos){if(tr.claves&&re(tr.claves).test(t)){encontrados.push(tr.nombre);for(const[id,c]of tr.comp){const l=porId(id);if(l)l.cantidad=redondea(l.cantidad+(id==="desp"?0:c));else pon(id,c)}}}
  for(const i of catalogo){
    if(!i.claves||i.id==="oficial"||i.id==="ayudante")continue;
    const fuente=i.claves;
    const conCant=new RegExp("(\\d+(?:[.,]\\d+)?)\\s*(?:m2|metros? cuadrados?|metros?|mts?|m|unidades|uds?|puntos?|sacos?)?\\s*(?:de\\s+)?(?:(?:nuev[oa]s?|[a-z]+)\\s+)?(?:"+fuente+")");
    const m=t.match(conCant);
    if(m&&!/horas?$/.test(t.slice(0,m.index+m[1].length+6))){pon(i.id,aNumero(m[1]))}
    else if(re(fuente).test(t)&&!porId(i.id))pon(i.id,1);
  }
  const dias=t.match(/(\d+(?:[.,]\d+)?)\s*dias?\b/);
  if(/medio dia/.test(t))pon("oficial",4);
  if(dias)pon("oficial",aNumero(dias[1])*8);
  const hAy=t.match(/(\d+(?:[.,]\d+)?)\s*horas?\s*de\s*ayudante/);
  const hOf=t.replace(/(\d+(?:[.,]\d+)?)\s*horas?\s*de\s*ayudante/,"").match(/(\d+(?:[.,]\d+)?)\s*horas?(\s*y\s*media)?/);
  if(hOf)pon("oficial",aNumero(hOf[1])+(hOf[2]?.5:0));
  if(hAy)pon("ayudante",aNumero(hAy[1]));
  else if(/con (1 )?ayudante/.test(t)){const o=porId("oficial");pon("ayudante",o?o.cantidad:8)}
  if(lineas.length&&!porId("desp"))pon("desp",1);
  if(lineas.length&&!porId("oficial"))pon("oficial",2);
  return{titulo:encontrados[0]||"",cliente:leerCliente(texto),lineas,dudas:[]};
}
function leerCliente(texto){
  const nombre=(texto.match(/(?:[Pp]ara|[Cc]liente:?)\s+(?:(?:la|el|don|doña|señora|señor|sr\.?|sra\.?)\s+)*([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/)||[])[1]||"";
  const direccion=(texto.match(/\b((?:calle|c\/|avenida|avda\.?|plaza|paseo|camino)\s+[^,.;]+?\d*)(?=\s*[,.;]|\s+(?:para|con|son|y)\s|$)/i)||[])[1]||"";
  const tel=(texto.replace(/\s/g,"").match(/(?:\+34)?[6789]\d{8}/)||[])[0]||"";
  return{nombre,direccion,telefono:tel};
}
function buscarItem(seg,catalogo){
  const s=conNumeros(norm(seg));
  const hits=catalogo.filter(i=>i.claves&&re(i.claves).test(s));
  if(hits.length){return hits.sort((a,b)=>(s.includes(norm(b.nombre))?1:0)-(s.includes(norm(a.nombre))?1:0))[0]}
  return catalogo.find(i=>norm(i.nombre).split(/\s+/).some(w=>w.length>4&&s.includes(w)));
}
function interpretarPrecios(texto,catalogo){
  const cambios=[];const nuevos=[];
  const t0=conNumeros(norm(texto));
  const global=t0.match(/(sube|subir|aumenta|aumentar|baja|bajar|reduce|reducir)\s+(?:todo|todos los precios|los precios)\s+(?:(?:un|1)\s+)?(\d+(?:[.,]\d+)?)\s*(?:%|por ciento)/);
  if(global){const signo=/^(sub|aum)/.test(global[1])?1:-1;const f=1+signo*aNumero(global[2])/100;
    for(const i of catalogo)cambios.push({id:i.id,nombre:i.nombre,antes:i.precio,despues:redondea(i.precio*f)});
    return{cambios,nuevos}}
  for(const seg of t0.split(/;|\s+y\s+|,\s+|\.\s+/)){
    if(!seg.trim())continue;
    const pct=seg.match(/(\d+(?:[.,]\d+)?)\s*(?:%|por ciento)/);
    const eur=seg.match(/(?:\ba|\ben|\bpor|\bson|\bcuesta|\bvale)\s+(\d+(?:[.,]\d+)?)(?:\s*(?:euros?|€|con (\d+)))?/);
    const esNuevo=/^\s*(anade|anadir|nuevo|nueva|crea|mete|agrega)\b/.test(seg);
    if(esNuevo&&eur){
      const nombre=seg.replace(/^\s*(anade|anadir|nuevo|nueva|crea|mete|agrega)\s+(el |la |un |1 |una )?(precio de |precio )?/,"").split(/\s+(?:a|en|por|son|cuesta|vale)\s+\d/)[0].trim();
      nuevos.push({nombre:nombre.charAt(0).toUpperCase()+nombre.slice(1),unidad:/metro/.test(seg)?"m":/hora/.test(seg)?"h":"ud",precio:aNumero(eur[1])});
      continue;
    }
    const it=buscarItem(seg,catalogo);if(!it)continue;
    if(pct){const baja=/(baja|bajar|reduce|reducir|quita|descuenta)/.test(seg);const f=1+(baja?-1:1)*aNumero(pct[1])/100;cambios.push({id:it.id,nombre:it.nombre,antes:it.precio,despues:redondea(it.precio*f)})}
    else if(eur){cambios.push({id:it.id,nombre:it.nombre,antes:it.precio,despues:redondea(aNumero(eur[1])+(eur[2]?aNumero(eur[2])/100:0))})}
  }
  return{cambios,nuevos};
}
function totales(q){
  const base=redondea(q.lineas.reduce((s,l)=>s+(Number(l.cantidad)||0)*(Number(l.precio)||0),0));
  const iva=redondea(base*(Number(q.iva)||0)/100);
  return{base,iva,total:redondea(base+iva),faltan:q.lineas.filter(l=>l.precio===null||l.precio===""||!isFinite(Number(l.precio))).length};
}
function euros(n){
  const neg=n<0;const[e,d]=Math.abs(Number(n)||0).toFixed(2).split(".");
  return(neg?"-":"")+e.replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+d+" €";
}
/*LOGIC-END*/

let vibrador=null;
function tap(fuerte){
  try{
    if(navigator.vibrate){navigator.vibrate(fuerte?[12,40,18]:10);return}
    if(!vibrador){vibrador=document.createElement("label");vibrador.style.cssText="position:fixed;left:-99px;width:1px;height:1px;overflow:hidden";vibrador.innerHTML='<input type="checkbox" switch tabindex="-1" aria-hidden="true">';document.body.append(vibrador)}
    vibrador.click();
  }catch(e){}
}
function cuenta(el,desde,hasta,fmt){
  if(QUIETO||desde===hasta){el.textContent=fmt(hasta);return}
  const t0=performance.now(),d=420;
  cancelAnimationFrame(el._raf);
  const paso=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(desde+(hasta-desde)*e);if(k<1)el._raf=requestAnimationFrame(paso)};
  el._raf=requestAnimationFrame(paso);
}
function salta(el){if(!el||QUIETO)return;el.classList.remove("salta");void el.offsetWidth;el.classList.add("salta")}
function toast(t){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const n=document.createElement("div");n.className="toast";n.setAttribute("role","status");n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600);
}

}
function nuevoQ(datos={}){

function escuchar(id){

  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript+" ";oido=t.trim();const v=(base+" "+oido).trim();const el=document.getElementById(id);if(el)el.value=v;if(id==="dictado")V.dictado=v;else V.preciosTexto=v};

function pdfDe(q){

    d.text("Fecha "+fecha(q.fecha),W-M,19.5,{align:"right"});d.text("Válido hasta "+fecha(v.toISOString().slice(0,10)),W-M,24,{align:"right"});
    d.setTextColor(...tinta);
  };
  banda();

  d.setFontSize(8);d.setTextColor(...gris);d.text("CLIENTE",M,y);d.text("EMITIDO POR",W/2+6,y);d.setTextColor(...tinta);d.setFontSize(10);y+=5;

  const der=[n.titular||n.nombre,n.nif&&"NIF "+n.nif,n.direccion,[n.telefono,n.email].filter(Boolean).join(" · ")].filter(Boolean);

  y=Math.max(fil(izq,M),fil(der,W/2+6))+3;

  thead();

    y+=rs.length*4.5+1;d.setDrawColor(220,227,233);d.setLineWidth(.2);d.line(M,y-2.4,W-M,y-2.4);y+=2.2;

    guardar();refrescarTotales();return}
  if(el.dataset.precio){const i=S.catalogo.find(x=>x.id===el.dataset.precio);const v=aPrecio(el.value);if(i&&v!==null){i.precio=v;guardar()}return}
  if(el.dataset.tcomp){const t=S.trabajos.find(x=>x.id===el.dataset.tcomp);const v=Number(String(el.value).replace(",","."));if(t&&v>=0){t.comp[+el.dataset.k][1]=v;guardar();const e2=document.getElementById("pt-"+t.id);if(e2)e2.textContent=euros(precioTrabajo(t))}return}
  if(el.dataset.neg){const k=el.dataset.neg;S.negocio[k]=(k==="iva"||k==="validez")?(Number(el.value)||0):el.value;guardar();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&V.hoja){V.hoja=null;render()}});

render();

bajar();
</script>
</body>
</html>
